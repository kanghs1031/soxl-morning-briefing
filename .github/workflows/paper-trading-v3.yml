name: SOXL v3 isolated verification
on:
  pull_request:
    branches: [main]
    paths: ['paper-trading/v3/**', 'tests/v3-*', 'scripts/*-v3.mjs', 'package*.json', 'playwright.config.mjs', '.github/workflows/paper-trading-v3.yml']
  push:
    branches: [feature/soxl-paper-trading-v3]
    paths: ['paper-trading/v3/**', 'tests/v3-*', 'scripts/*-v3.mjs', 'package*.json', 'playwright.config.mjs', '.github/workflows/paper-trading-v3.yml']
permissions:
  contents: read
jobs:
  paper-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
